<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Body -->
  <ellipse cx="100" cy="130" rx="50" ry="45" fill="#FF9F43"/>

  <!-- Head -->
  <circle cx="100" cy="70" r="45" fill="#FF9F43"/>

  <!-- Left Ear -->
  <polygon points="65,35 55,5 85,25" fill="#FF9F43"/>
  <polygon points="68,32 60,12 80,28" fill="#FFB6C1"/>

  <!-- Right Ear -->
  <polygon points="135,35 145,5 115,25" fill="#FF9F43"/>
  <polygon points="132,32 140,12 120,28" fill="#FFB6C1"/>

  <!-- Eyes -->
  <ellipse cx="80" cy="65" rx="10" ry="12" fill="white"/>
  <ellipse cx="120" cy="65" rx="10" ry="12" fill="white"/>
  <circle cx="82" cy="67" r="6" fill="#2C3E50"/>
  <circle cx="122" cy="67" r="6" fill="#2C3E50"/>
  <circle cx="84" cy="65" r="2" fill="white"/>
  <circle cx="124" cy="65" r="2" fill="white"/>

  <!-- Nose -->
  <ellipse cx="100" cy="82" rx="6" ry="4" fill="#FF6B6B"/>

  <!-- Mouth -->
  <path d="M100,86 Q90,95 85,90" stroke="#2C3E50" stroke-width="2" fill="none"/>
  <path d="M100,86 Q110,95 115,90" stroke="#2C3E50" stroke-width="2" fill="none"/>

  <!-- Whiskers -->
  <line x1="60" y1="78" x2="30" y2="73" stroke="#2C3E50" stroke-width="1.5"/>
  <line x1="60" y1="85" x2="30" y2="85" stroke="#2C3E50" stroke-width="1.5"/>
  <line x1="60" y1="92" x2="30" y2="97" stroke="#2C3E50" stroke-width="1.5"/>
  <line x1="140" y1="78" x2="170" y2="73" stroke="#2C3E50" stroke-width="1.5"/>
  <line x1="140" y1="85" x2="170" y2="85" stroke="#2C3E50" stroke-width="1.5"/>
  <line x1="140" y1="92" x2="170" y2="97" stroke="#2C3E50" stroke-width="1.5"/>

  <!-- Blush -->
  <ellipse cx="65" cy="85" rx="8" ry="5" fill="#FFB6C1" opacity="0.6"/>
  <ellipse cx="135" cy="85" rx="8" ry="5" fill="#FFB6C1" opacity="0.6"/>

  <!-- Front Paws -->
  <ellipse cx="70" cy="165" rx="15" ry="10" fill="#FF9F43"/>
  <ellipse cx="130" cy="165" rx="15" ry="10" fill="#FF9F43"/>

  <!-- Tail -->
  <path d="M150,140 Q180,120 175,90" stroke="#FF9F43" stroke-width="12" fill="none" stroke-linecap="round"/>

  <!-- Belly pattern -->
  <ellipse cx="100" cy="140" rx="25" ry="20" fill="#FFEAA7"/>
</svg>
